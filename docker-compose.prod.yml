# Production overrides for docker-compose
# Usage: docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  frontend:
    build:
      target: production
      args:
        - NODE_ENV=production
    ports:
      - "80:80"
    restart: always
    environment:
      - NODE_ENV=production
    # Remove volumes in production - use baked-in code from image

  backend:
    build:
      target: production
      args:
        - ENVIRONMENT=production
    ports:
      - "5000:5000"
    restart: always
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - DEBUG=False
      - FRONTEND_HOST=http://localhost  # Production frontend URL for email links
    # Remove volumes in production - use baked-in code from image
    command: gunicorn -c gunicorn.conf.py main:app

  db:
    restart: always
    # Don't expose ports externally in production (only via Docker network)
    # Uncomment if you need external access:
    # ports:
    #   - "5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-chat_prod}
    # Use production volume
    volumes:
      - pg_data:/var/lib/postgresql/data
